{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<div id="ui"><button id="btnReset" type="button">Reset view</button><button id="btnPause" type="button">Pause</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   0. CONSTANTS & UTILITIES
   ============================================================ */
const TAU = Math.PI * 2;
const TW = 8, TD = 4, TH = 5, GT = 0.09;          // tank outer size, glass thickness
const IX = TW / 2 - GT, IZ = TD / 2 - GT;         // inner half extents
const WL = 4.55;                                   // waterline
const FILTER = { x: 3.15, z: -1.42 };
const OUTLET = new THREE.Vector3(FILTER.x, 2.74, FILTER.z);
const LAMP_Y = 6.35;
const L_WATER = 1, L_GLASS = 2, L_EXT = 3;                   // render layers

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(20261110);
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash2(x, y){ const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
function hash3(x, y, z){ const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function vnoise3(x, y, z){
  const zi = Math.floor(z), zf = z - zi, w = zf * zf * (3 - 2 * zf);
  return lerp(vnoise(x + zi * 37.3, y + zi * 17.9), vnoise(x + (zi + 1) * 37.3, y + (zi + 1) * 17.9), w);
}
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1 + 5.2, y * 2.1 + 1.3) * .3 + vnoise(x * 4.3 + 9.1, y * 4.3 + 7.7) * .2;
/** piecewise smooth profile through [[s,v],...] */
function prof(pts){
  return s => {
    if (s <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (s <= pts[i][0]) {
      const a = pts[i - 1], b = pts[i], t = (s - a[0]) / (b[0] - a[0]);
      return lerp(a[1], b[1], t * t * (3 - 2 * t));
    }
    return pts[pts.length - 1][1];
  };
}
const f = n => (Math.abs(n) < 1e-7 ? 0 : n).toFixed(5);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const _v1 = V3(), _v2 = V3(), _v3 = V3(), _q1 = new THREE.Quaternion(), _m1 = new THREE.Matrix4();

/* ---------- substrate height (simplified collision surface) ---------- */
const MOUNDS = [[-0.4,-0.85,1.5,.07],[-3.2,-1.35,.8,.09],[1.75,-1.2,.8,.07],[2.55,0.15,.8,.06],[-2.35,0.85,.7,.05],[3.1,-1.4,.7,.05]];
function bedH(x, z){
  const s = 0.5 - 0.5 * z / IZ;                      // 0 front → 1 back
  let h = 0.33 + 0.22 * s * s + 0.10 * (fbm(x * 0.55 + 3, z * 0.55 + 8) - 0.5);
  for (const m of MOUNDS){ const d2 = ((x - m[0]) ** 2 + (z - m[1]) ** 2) / (m[2] * m[2]); if (d2 < 4) h += m[3] * Math.exp(-d2 * 1.6); }
  return h;
}
const CLIMB = [[1.05, 1.42, 0.24, 0.085], [2.45, 1.3, 0.2, 0.07]];   // flat stones snail A may climb: x,z,r,h
function groundH(x, z){
  let h = bedH(x, z);
  for (const c of CLIMB){ const d = Math.hypot(x - c[0], z - c[1]) / c[2]; if (d < 1) h += c[3] * Math.sqrt(1 - d * d) ** 1.2; }
  return h;
}

/* ---------- surface waves: one definition shared by JS + GLSL ---------- */
const WAVES = [[1,.3,1.9,.016,.42,0],[-.6,1,1.25,.009,.33,1.7],[.4,-1,.8,.004,.27,3.1],[-1,-.5,.52,.0016,.21,.6],[.9,.9,.34,.0007,.17,4.4],[.2,1,.43,.0011,.19,2.2]]
  .map(([dx, dz, len, amp, sp, ph]) => { const l = Math.hypot(dx, dz), k = TAU / len; return { kx: dx / l * k, kz: dz / l * k, amp, w: sp * k, ph }; });
function waveH(x, z, t){ let h = 0; for (const w of WAVES) h += w.amp * Math.sin(w.kx * x + w.kz * z - w.w * t + w.ph); return h; }
const wArg = w => `${f(w.kx)}*p.x+${f(w.kz)}*p.y-${f(w.w)}*t+${f(w.ph)}`;
const GLSL_WAVES = `
float waveH(vec2 p,float t){float h=0.;${WAVES.map(w => `h+=${f(w.amp)}*sin(${wArg(w)});`).join('')}return h;}
vec2 waveG(vec2 p,float t){vec2 g=vec2(0.);${WAVES.map(w => `g+=${f(w.amp)}*cos(${wArg(w)})*vec2(${f(w.kx)},${f(w.kz)});`).join('')}return g;}
vec3 waveHess(vec2 p,float t){vec3 H=vec3(0.);${WAVES.map(w => `H-=${f(w.amp)}*sin(${wArg(w)})*vec3(${f(w.kx * w.kx)},${f(w.kz * w.kz)},${f(w.kx * w.kz)});`).join('')}return H;}
// light focusing under the animated surface: 1/|det(I - c*Hessian)| of the refracted light map
float caustic(vec3 wp,float t){
  float d=clamp(${f(WL)}-wp.y,0.,4.6);
  vec2 p=wp.xz+0.10*sin(wp.zx*1.9+t*0.21)+0.05*wp.y;
  vec3 H=waveHess(p,t)*(0.75*d+0.4);
  float det=(1.-H.x)*(1.-H.y)-H.z*H.z;
  float I=1./(abs(det)+0.22);
  return clamp(I-1.,-0.4,2.6)*smoothstep(0.,.35,d);
}`;
const GLSL_ENV = `
vec3 envBase(vec3 d){
  vec3 c=mix(vec3(0.010,0.028,0.060),vec3(0.030,0.150,0.180),smoothstep(-0.75,0.95,d.y));
  c+=vec3(0.30,0.42,0.50)*pow(max(dot(d,normalize(vec3(-0.55,0.55,0.62))),0.),5.)*0.55;
  c+=vec3(0.20,0.34,0.36)*pow(max(dot(d,normalize(vec3(0.7,0.35,-0.6))),0.),4.)*0.35;
  return c;
}
// environment with the lamp bar treated as a positioned area light (parallax-correct reflection)
vec3 envLamp(vec3 pos,vec3 d){
  vec3 c=envBase(d);
  if(d.y>0.02){vec3 h=pos+d*((${f(LAMP_Y)}-pos.y)/d.y);
    c+=vec3(1.,.97,.9)*5.*(1.-smoothstep(3.0,3.25,abs(h.x)))*(1.-smoothstep(0.14,0.26,abs(h.z)));}
  return c;
}`;
/* ---------- shared current field (JS + GLSL mirror) ---------- */
function currentAt(x, y, z, t, o){
  let vx = .5 * Math.sin(.31 * t + y * .9 + z * .7) + .3 * Math.sin(.53 * t + x * .6 + 1.7);
  let vz = .35 * Math.cos(.27 * t + x * .5 + y * .6) + .2 * Math.sin(.61 * t + z * 1.1);
  let vy = .15 * Math.sin(.4 * t + x * .8 + z * .5);
  const dx = x - FILTER.x, dz = z - FILTER.z, d2 = dx * dx + dz * dz;
  vy += 1.6 * Math.exp(-d2 / .35) * smooth(2.2, 3.0, y);
  const sp = .9 * Math.exp(-d2 / 2.5) * smooth(3.3, 4.4, y) / (Math.sqrt(d2) + .3);
  return o.set(vx + dx * sp, vy, vz + dz * sp);
}
const GLSL_CURRENT = `
vec3 currentAt(vec3 p,float t){
  vec3 v=vec3(.5*sin(.31*t+p.y*.9+p.z*.7)+.3*sin(.53*t+p.x*.6+1.7), .15*sin(.4*t+p.x*.8+p.z*.5), .35*cos(.27*t+p.x*.5+p.y*.6)+.2*sin(.61*t+p.z*1.1));
  vec2 dd=p.xz-vec2(${f(FILTER.x)},${f(FILTER.z)});float d2=dot(dd,dd);
  v.y+=1.6*exp(-d2/.35)*smoothstep(2.2,3.0,p.y);
  v.xz+=dd*(.9*exp(-d2/2.5)*smoothstep(3.3,4.4,p.y)/(sqrt(d2)+.3));
  return v;
}`;

/* ============================================================
   1. RENDERER, SCENE, CAMERA, CONTROLS
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.5, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 4.4; controls.minPolarAngle = 0.2; controls.maxPolarAngle = 1.6;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.8; controls.panSpeed = 0.6;
const VIEW_TARGET = V3(0, 2.55, 0), VIEW_DIR = V3(0.36, 0.3, 0.88).normalize();
function fitDistance(){
  const v = THREE.MathUtils.degToRad(camera.fov / 2), h = Math.atan(Math.tan(v) * camera.aspect);
  return 5.1 / Math.sin(Math.min(v, h)) * (camera.aspect < 1 ? 1.0 : 0.86);
}
function resetView(){
  const d = fitDistance();
  controls.maxDistance = d * 1.7;
  controls.target.copy(VIEW_TARGET);
  camera.position.copy(VIEW_TARGET).addScaledVector(VIEW_DIR, d);
  controls.update();
}
function constrainCamera(){                    // panning can never carry the view into the tank or pedestal
  const t = controls.target;
  t.x = clamp(t.x, -2.0, 2.0); t.y = clamp(t.y, 1.0, 4.0); t.z = clamp(t.z, -0.6, 0.6);
}

/* ---------- shared uniforms + material enhancer (caustics, hooks) ---------- */
const shared = { uTime: { value: 0 }, uCaustic: { value: 0.5 } };
function enhance(mat, o = {}){
  const uni = Object.assign({}, shared, o.uniforms || {});
  mat.userData.uni = uni;
  const cs = o.caustic ?? 1;
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, uni);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWPos;varying vec3 vOPos;varying vec2 vUvC;uniform float uTime;\n${o.vertHead || ''}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>\nvOPos=position;vUvC=uv;\n${o.vertBody || ''}`)
      .replace('#include <project_vertex>', `#include <project_vertex>\n{vec4 wpC=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nwpC=instanceMatrix*wpC;\n#endif\nvWPos=(modelMatrix*wpC).xyz;}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWPos;varying vec3 vOPos;varying vec2 vUvC;uniform float uTime;uniform float uCaustic;\n${GLSL_WAVES}\n${o.fragHead || ''}`)
      .replace('#include <color_fragment>', `#include <color_fragment>\n${o.fragColor || ''}`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
{float cm=step(vWPos.y,${f(WL)})*${f(cs)};vec3 nW=inverseTransformDirection(normal,viewMatrix);
 reflectedLight.directDiffuse+=diffuseColor.rgb*vec3(1.,.97,.9)*caustic(vWPos,uTime)*cm*clamp(nW.y*.6+.55,.12,1.)*uCaustic;
 ${o.fragLight || ''}}`);
  };
  mat.customProgramCacheKey = () => (o.key || 'base') + '|' + cs;
  return mat;
}
/** canvas helper for runtime-generated surface patterns */
function makeCanvasTex(w, h, draw, srgb = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function shadowed(o, cast = true, recv = true){ o.traverse(m => { if (m.isMesh){ m.castShadow = cast; m.receiveShadow = recv; } }); return o; }

/* ============================================================
   2. STAGE 1 — AQUARIUM, PEDESTAL, BACKDROP, LIGHTING
   ============================================================ */
function createBackdrop(){
  const g = new THREE.Group(); g.name = 'Backdrop';
  const sky = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: `varying vec3 vD;${GLSL_ENV}
      void main(){gl_FragColor=vec4(envBase(normalize(vD)),1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      }` }));
  sky.frustumCulled = false; g.add(sky);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(44, 44), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, color: 0x000000,
    alphaMap: makeCanvasTex(256, 256, (c, w, h) => { const gr = c.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
      gr.addColorStop(0, '#9a9a9a'); gr.addColorStop(.35, '#555'); gr.addColorStop(1, '#000'); c.fillStyle = gr; c.fillRect(0, 0, w, h); }, false) }));
  fl.rotation.x = -Math.PI / 2; fl.position.y = -3.6; g.add(fl);
  return g;
}
function glassMaterial(thin){
  return new THREE.ShaderMaterial({
    transparent: true, premultipliedAlpha: true, depthWrite: false, uniforms: { uThin: { value: thin } },
    vertexShader: `varying vec3 vW;varying vec3 vN;varying vec3 vON;
      void main(){vON=normal;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader: `uniform vec3 uThin;varying vec3 vW;varying vec3 vN;varying vec3 vON;${GLSL_ENV}
      float grimeHash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float grimeNoise(vec2 p){
        vec2 i=floor(p),a=fract(p);a=a*a*(3.-2.*a);
        return mix(mix(grimeHash(i),grimeHash(i+vec2(1.,0.)),a.x),
                   mix(grimeHash(i+vec2(0.,1.)),grimeHash(i+vec2(1.)),a.x),a.y);
      }
      void main(){
        vec3 V=normalize(vW-cameraPosition);vec3 N=normalize(vN);
        float c=max(dot(-V,N),0.);float F=0.04+0.96*pow(1.-c,5.);          // Schlick, IOR 1.5
        vec3 refl=envLamp(vW,reflect(V,N));
        float edge=1.-step(0.5,abs(dot(vON,uThin)));                         // pane thickness faces
        vec3 tint=mix(vec3(0.50,0.80,0.76),vec3(0.10,0.34,0.29),edge);
        float ta=mix(0.03,0.62,edge);
        float streak=edge*pow(max(dot(reflect(V,N),normalize(vec3(0.1,0.9,0.3))),0.),8.)*0.6;
        vec3 col=refl*F*mix(0.9,0.5,edge)+tint*ta*(0.55+0.45*N.y)+vec3(0.7,1.,0.95)*streak;
        // Static, world-anchored deposits on each pane, strongest near the gravel.
        vec2 paneUV=vec2(abs(uThin.x)>.5?vW.z:vW.x,vW.y);
        float patches=grimeNoise(paneUV*5.3)*.65+grimeNoise(paneUV*17.)*.35;
        float submerged=1.-smoothstep(${f(WL-.04)},${f(WL+.03)},vW.y);
        float bottom=1.-smoothstep(.45,1.35,vW.y);
        float algae=smoothstep(.40,.76,patches)*bottom*submerged*.32;
        float film=smoothstep(.48,.8,patches)*submerged*.045;
        float ring=exp(-pow((vW.y-${f(WL+.025)}+(.5-grimeNoise(paneUV*8.))*.025)/.035,2.));
        float mineral=ring*(.045+.10*grimeNoise(paneUV*32.));
        float drip=pow(grimeNoise(vec2(paneUV.x*38.,paneUV.y*.7)),12.)*.065;
        drip*=smoothstep(${f(WL-.4)},${f(WL)},vW.y);
        float dirt=clamp((algae+film+mineral+drip)*(1.-edge),0.,.4);
        vec3 deposit=mix(vec3(.16,.24,.075),vec3(.65,.61,.45),
                         clamp((mineral+drip)/max(dirt,.001),0.,1.));
        col=col*(1.-dirt)+deposit*dirt;
        float alpha=clamp(F+ta,0.,1.);
        gl_FragColor=vec4(col,alpha+dirt*(1.-alpha));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }` });
}
function createAquarium(){
  const g = new THREE.Group(); g.name = 'Aquarium';
  const pane = (w, h, d, x, y, z, thin) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassMaterial(thin));
    m.position.set(x, y, z); m.layers.set(L_GLASS); m.renderOrder = 10; g.add(m); return m; };
  pane(TW, TH, GT, 0, TH / 2, TD / 2 - GT / 2, V3(0, 0, 1)).name = 'GlassFront';
  pane(TW, TH, GT, 0, TH / 2, -TD / 2 + GT / 2, V3(0, 0, 1)).name = 'GlassBack';
  pane(GT, TH, TD - 2 * GT, -TW / 2 + GT / 2, TH / 2, 0, V3(1, 0, 0)).name = 'GlassLeft';
  pane(GT, TH, TD - 2 * GT, TW / 2 - GT / 2, TH / 2, 0, V3(1, 0, 0)).name = 'GlassRight';
  pane(TW - 2 * GT, GT, TD - 2 * GT, 0, GT / 2, 0, V3(0, 1, 0)).name = 'GlassBottom';
  // silicone seams in the inner vertical corners
  const seamM = new THREE.MeshStandardMaterial({ color: 0xbfcfcf, roughness: .45, transparent: true, opacity: .32 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]){
    const s = new THREE.Mesh(new THREE.BoxGeometry(.034, TH - GT - .06, .034), seamM); s.position.set(sx * (IX - .014), (TH + GT) / 2 - .03, sz * (IZ - .014)); g.add(s); }
  // matte-black bottom frame and narrow rim
  const black = new THREE.MeshStandardMaterial({ color: 0x060607, roughness: .92, metalness: 0, envMapIntensity: .25 });
  const bar = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), black); m.position.set(x, y, z); m.layers.set(L_EXT); g.add(m); return m; };
  bar(TW + .12, .1, TD + .12, 0, -.05, 0);
  for (const s of [-1, 1]){
    bar(TW + .12, .2, .06, 0, .1, s * (TD / 2 + .03)); bar(.06, .2, TD + .12, s * (TW / 2 + .03), .1, 0);
    bar(TW + .08, .07, GT + .08, 0, TH - .01, s * (TD / 2 - GT / 2)); bar(GT + .08, .07, TD - 2 * GT - .08, s * (TW / 2 - GT / 2), TH - .01, 0);
  }
  return g;
}
function createPedestal(){
  const g = new THREE.Group(); g.name = 'Pedestal';
  const m = new THREE.MeshStandardMaterial({ color: 0x0c0e11, roughness: .8, metalness: 0, envMapIntensity: .35 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(8.9, 3.4, 4.9), m); body.position.y = -1.92; body.receiveShadow = true;
  const top = new THREE.Mesh(new THREE.BoxGeometry(9.2, .12, 5.2), new THREE.MeshStandardMaterial({ color: 0x0e1114, roughness: .7, metalness: 0, envMapIntensity: .4 }));
  top.position.y = -.16; top.receiveShadow = true;
  const cs = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 5.2), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, color: 0x000000, opacity: .75,
    alphaMap: makeCanvasTex(256, 144, (c, w, h) => { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); c.shadowColor = '#fff'; c.shadowBlur = 14; c.fillStyle = '#fff';
      c.fillRect(w * .055, h * .08, w * .89, h * .84); }, false) }));
  cs.rotation.x = -Math.PI / 2; cs.position.y = -.097;
  g.add(body, top, cs); return g;
}
function createLamp(){
  const g = new THREE.Group(); g.name = 'AquariumLight';

  const foot = new THREE.Mesh(mergeGeometries([fg, sole]), skin); foot.name = 'Foot'; g.add(foot);
  // head with two fine tentacles
  const head = new THREE.Group(); head.position.set(.105, .02, 0);
  head.add(new THREE.Mesh(paint(new THREE.SphereGeometry(1, 14, 10).scale(.05, .03, .04), o.body), skin));
  const tents = [];
  for (const sz of [-1, 1]){ const pv = new THREE.Group(); pv.position.set(.03, .016, sz * .018);
    pv.add(new THREE.Mesh(paint(new THREE.CylinderGeometry(.0032, .0075, .085, 6).translate(0, .0425, 0), [o.body[0] * .7, o.body[1] * .7, o.body[2] * .7], o.body), skin));
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.0055, 8, 6), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: .2 })); eye.position.set(.004, .008, sz * .004); pv.add(eye);
    head.add(pv); tents.push(pv); }
  g.add(head);
  // spiral shell seated on the back, spire to the right, slightly tilted
  const sh = new THREE.Group(); sh.position.set(-.025, o.R + o.r * .55 + .02, .004); sh.rotation.set(-.3, .18, 0);
  const shell = new THREE.Mesh(shellGeometry(o), shellM); shell.name = 'Shell'; sh.add(shell); g.add(sh);
  shadowed(g, true, false); g.scale.setScalar(o.scale || 1);
  return { g, foot, head, tents, sh, ph: o.ph || 0 };
}
function animateSnailParts(S, t, moving, retract){
  const w = t * 1.5 + S.ph;
  S.foot.scale.set(1 + .05 * Math.sin(w) * moving, 1 + .04 * Math.sin(w + 1.5) * moving, 1 - .03 * Math.sin(w) * moving);     // peristaltic stretch/squash
  S.head.position.x = .105 + .012 * Math.sin(w - 1) * moving - .03 * retract; S.head.rotation.y = .22 * Math.sin(t * .43 + S.ph * 2); S.head.rotation.z = .1 * Math.sin(t * .31 + S.ph);
  S.sh.rotation.z = .045 * Math.sin(w + .8) * moving; S.sh.position.x = -.025 - .008 * Math.sin(w) * moving;                    // shell rides the body
  S.tents.forEach((p, i) => { const s = i ? 1 : -1; p.rotation.z = -1.0 + .22 * Math.sin(t * .9 + i * 1.7 + S.ph) + .5 * retract; p.rotation.x = s * (.38 + .2 * Math.sin(t * .63 + i * 2.3 + S.ph));
    p.scale.y = 1 - .55 * retract + .08 * Math.sin(t * 1.3 + i); });
}
// --- Snail A: bottom crawler (amber-brown, growth bands) ---
const snailA = createSnail({ name: 'Snail_Bottom', R: .05, r: .046, H: .062, b: .125, scale: 1.05, ph: 0, body: [.4, .33, .24],
  color: (th, ph, sc) => { const band = .5 + .5 * Math.sin(th * 15 + Math.sin(ph) * .6), fine = .5 + .5 * Math.sin(th * 61);
    return mixc(mixc([.80, .52, .16], [.40, .2, .07], band * .8 + fine * .15), [.9, .75, .45], (1 - sc) * .35); } });
Object.assign(snailA, { pos: V3(.35, 0, 1.52), heading: .1, wp: 0, v: 0, r: .2, retract: 0,
  route: [[1.05, 1.42], [1.75, 1.56], [2.45, 1.3], [2.95, 1.58], [2.05, 1.28], [1.05, 1.42], [.2, 1.56], [-.65, 1.48]] });
bottomDyn.push(snailA);
const _sn = V3(), _sf = V3(), _sr = V3(), _sq = new THREE.Quaternion();
function updateSnailA(t, dt){
  const S = snailA, p = S.pos, w = S.route[S.wp], dx = w[0] - p.x, dz = w[1] - p.z;
  if (Math.hypot(dx, dz) < .07) S.wp = (S.wp + 1) % S.route.length;
  const near = Math.hypot(crab.pos.x - p.x, crab.pos.z - p.z) < .62;                         // yields to the crab: stops and pulls its head in
  S.retract += ((near ? 1 : 0) - S.retract) * Math.min(1, dt * 1.5);
  let e = Math.atan2(-dz, dx) - S.heading; e = Math.atan2(Math.sin(e), Math.cos(e));
  S.heading += clamp(e, -.3 * dt, .3 * dt);
  S.v += ((near ? 0 : .03 * (1 - .5 * Math.min(1, Math.abs(e)))) - S.v) * Math.min(1, dt * 1.2);
  const pulse = 1 + .35 * Math.sin(t * 1.5);                                                 // crawling in gentle surges
  p.x = clamp(p.x + Math.cos(S.heading) * S.v * pulse * dt, -IX + .2, IX - .2); p.z = clamp(p.z - Math.sin(S.heading) * S.v * pulse * dt, -IZ + .2, IZ - .19);
  const e2 = .07, h = groundH(p.x, p.z);
  _sn.set(groundH(p.x - e2, p.z) - groundH(p.x + e2, p.z), 2 * e2, groundH(p.x, p.z - e2) - groundH(p.x, p.z + e2)).normalize();     // surface normal
  _sf.set(Math.cos(S.heading), 0, -Math.sin(S.heading)); _sf.addScaledVector(_sn, -_sf.dot(_sn)).normalize(); _sr.crossVectors(_sf, _sn);
  _sq.setFromRotationMatrix(_m1.makeBasis(_sf, _sn, _sr)); S.g.quaternion.slerp(_sq, Math.min(1, dt * 2.5));
  p.y = h + .003; S.g.position.copy(p);
  animateSnailParts(S, t, S.v / .03, S.retract);
}
// --- Snail B: glass crawler (cream/olive shell with dark spiral stripes) on the inside of the front pane ---
const snailB = createSnail({ name: 'Snail_Glass', R: .046, r: .043, H: .075, b: .135, scale: .95, ph: 2.4, body: [.3, .31, .24],
  color: (th, ph, sc) => { const st = smooth(.35, .6, .5 + .5 * Math.sin(ph * 3 + 1.2)), spk = hash2(Math.floor(th * 9), Math.floor(ph * 2.5)) > .8 ? .5 : 0;
    return mixc(mixc([.82, .8, .52], [.55, .58, .3], .5 + .5 * Math.sin(th * 7)), [.15, .12, .05], Math.max(st * .85, spk)); } });
Object.assign(snailB, { x: -3.22, y: 1.02, a: .95, v: 0, leg: 1, ends: [[-3.3, .92], [-2.82, 1.5]] });
const GLASS_Z = WZ - .0035;                       // foot sole rests on the inner face of the front pane
function updateSnailB(t, dt){
  const S = snailB, w = S.ends[S.leg], dx = w[0] - S.x, dy = w[1] - S.y;
  if (Math.hypot(dx, dy) < .05) S.leg = 1 - S.leg;
  let e = Math.atan2(dy, dx) - S.a; e = Math.atan2(Math.sin(e), Math.cos(e));
  S.a += clamp(e, -.16 * dt, .16 * dt);
  S.v += (.012 * (1 - .4 * Math.min(1, Math.abs(e))) - S.v) * Math.min(1, dt);
  const pulse = 1 + .4 * Math.sin(t * 1.2 + 1);
  S.x = clamp(S.x + Math.cos(S.a) * S.v * pulse * dt, -IX + .25, IX - .25); S.y = clamp(S.y + Math.sin(S.a) * S.v * pulse * dt, .8, WL / 3 + .05);   // lower third, always under water
  _sf.set(Math.cos(S.a), Math.sin(S.a), 0); _sn.set(0, 0, -1); _sr.crossVectors(_sf, _sn);
  S.g.quaternion.setFromRotationMatrix(_m1.makeBasis(_sf, _sn, _sr)); S.g.position.set(S.x, S.y, GLASS_Z);
  animateSnailParts(S, t, 1, 0);
}
scene.add(snailA.g, snailB.g);
updaters.push(updateSnailA, updateSnailB);

/* ============================================================
   12. STAGE 14 — SUSPENDED PARTICLES (drift with the shared current)
   ============================================================ */
const PART_N = 110, partPos = new Float32Array(PART_N * 3), partUni = { uPx: { value: 600 } };
function createParticles(){
  const g = new THREE.BufferGeometry(), sz = new Float32Array(PART_N);
  for (let i = 0; i < PART_N; i++){ partPos[i * 3] = rr(-IX + .1, IX - .1); partPos[i * 3 + 1] = rr(.7, WL - .15); partPos[i * 3 + 2] = rr(-IZ + .1, IZ - .1); sz[i] = rr(.012, .03); }
  g.setAttribute('position', new THREE.BufferAttribute(partPos, 3).setUsage(THREE.DynamicDrawUsage)); g.setAttribute('aS', new THREE.BufferAttribute(sz, 1));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: partUni,
    vertexShader: `uniform float uPx;attribute float aS;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=max(aS*uPx/-mv.z,1.);gl_Position=projectionMatrix*mv;}`,
    fragmentShader: `void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vec3(.82,.93,.9),(1.-smoothstep(.08,.5,d))*.26);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }` }));
  m.name = 'SuspendedParticles'; m.frustumCulled = false; return m;
}
const particles = createParticles(); scene.add(particles);
updaters.push((t, dt) => {
  for (let i = 0; i < PART_N; i++){
    const o = i * 3, c = currentAt(partPos[o], partPos[o + 1], partPos[o + 2], t, _v1);
    partPos[o] += c.x * .05 * dt; partPos[o + 1] += (c.y * .05 - .004) * dt; partPos[o + 2] += c.z * .05 * dt;
    if (Math.abs(partPos[o]) > IX - .08 || Math.abs(partPos[o + 2]) > IZ - .08 || partPos[o + 1] > WL - .1 || partPos[o + 1] < bedH(partPos[o], partPos[o + 2]) + .05){
      partPos[o] = rr(-IX + .15, IX - .15); partPos[o + 1] = rr(.8, WL - .2); partPos[o + 2] = rr(-IZ + .15, IZ - .15); }
  }
  particles.geometry.attributes.position.needsUpdate = true;
});


/* ============================================================
   99. STAGE 15/16 — PRESENTATION, RENDER PASSES, MAIN LOOP
   ============================================================ */
let paused = false, simT = 0, lastNow = performance.now();
let dprCap = 2, ftAcc = 0, ftN = 0;                                        // adaptive quality: optical resolution drops before any feature does
const _db = new THREE.Vector2();
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, dprCap));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(_db);
  const sc = Math.min(1, Math.sqrt(3.4e6 / (_db.x * _db.y)));            // cap the optical render target
  sceneRT.setSize(Math.max(2, Math.round(_db.x * sc)), Math.max(2, Math.round(_db.y * sc)));
  waterUni.uRes.value.copy(_db);
  controls.maxDistance = fitDistance() * 1.7;
  partUni.uPx.value = _db.y * .5 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
}
function render(){
  renderer.shadowMap.needsUpdate = true;
  // pass 1: everything except the water interfaces and glass → colour + depth for refraction (no feedback possible)
  camera.layers.set(0);
  renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
  // pass 2: final image; water interfaces resolve refraction from pass 1, glass is composited last
  renderer.setRenderTarget(null);
  camera.layers.enable(L_WATER); camera.layers.enable(L_GLASS); camera.layers.enable(L_EXT);
  renderer.render(scene, camera);
}
function frame(now){
  requestAnimationFrame(frame);
  const raw = (now - lastNow) / 1000, dt = Math.min(raw, 0.05); lastNow = now;      // clamp after hidden-tab resume
  if (raw < .25){ ftAcc += raw; if (++ftN >= 90){ if (ftAcc / ftN > 1 / 38 && dprCap > 1){ dprCap = Math.max(1, dprCap - .25); resize(); } ftAcc = 0; ftN = 0; } }
  controls.update(); constrainCamera();
  if (!paused){ simT += dt; shared.uTime.value = simT; for (const u of updaters) u(simT, dt); }
  render();
}
const btnPause = document.getElementById('btnPause');
btnPause.addEventListener('click', () => { paused = !paused; btnPause.textContent = paused ? 'Resume' : 'Pause'; });
document.getElementById('btnReset').addEventListener('click', resetView);
window.addEventListener('resize', resize);
resize(); resetView();
for (let i = 0; i < 240; i++){ simT += 1 / 30; for (const u of updaters) u(simT, 1 / 30); }   // pre-roll so the scene opens already alive
shared.uTime.value = simT;
requestAnimationFrame(frame);

</script>
